<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ExtensionKit has moved</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://getextensionkit.github.io/" />
  <meta http-equiv="refresh" content="0; url=https://getextensionkit.github.io/" />
  <script>
    // Keep the page (terms.html, privacy.html…), query string and anchor when redirecting.
    var path = location.pathname.replace(/^\/extensionkit\/?/, '')
    location.replace('https://getextensionkit.github.io/' + path + location.search + location.hash)
  </script>
</head>
<body>
  <p>ExtensionKit has moved to <a href="https://getextensionkit.github.io/">getextensionkit.github.io</a>.</p>
</body>
</html>
